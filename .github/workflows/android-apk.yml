name: Android APK

# Builds the release APK, smoke tests it on an Android 11 emulator, and publishes it on the
# releases page so it can be installed straight from GitHub. A build of master is a full
# release, the one ObtainX follows; a build of any other branch is a prerelease.
#
# Every build gets its own version, from the run number: 2.3.<run> as the version name and the
# release tag (v2.3.<run>), and a version code that always goes up, so Android and ObtainX
# both see each build as an update. Every build is signed with the same key.
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - claude/screen-off-timer-478-default-c3xlu9
      - claude/saved-experiences-o5xqcw

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # Above the version code of the last Play Store release (3145750), so these install as
      # updates over it, and one higher on every run.
      - name: Set the version of this build
        run: |
          version_name="2.3.${{ github.run_number }}"
          version_code=$((3146000 + ${{ github.run_number }}))
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.version = process.argv[1];
            config.expo.android.versionCode = Number(process.argv[2]);
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
          ' "$version_name" "$version_code"

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean

      # The generated project signs release builds with the debug key, which is enough to
      # sideload. A Play Store build still goes through EAS.
      - name: Build the release APK
        working-directory: android
        # Only the ABIs that matter: arm64 for the phone, x86_64 for the emulator. All four
        # made packaging run out of memory, and the build twice as slow.
        run: >-
          ./gradlew assembleRelease --no-daemon --stacktrace
          -PreactNativeArchitectures=arm64-v8a,x86_64
          "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "breathly-v$VERSION_NAME.apk"

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: breathly-apk
          path: breathly-*.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Smoke test on an Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/android-smoke-test.sh "breathly-v${{ env.VERSION_NAME }}.apk"

      # Maestro keeps a screenshot and the view hierarchy of every failed step.
      - name: Keep the smoke test's debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests
          if-no-files-found: ignore

      - name: Publish the APK as a prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Breathly ${{ env.VERSION_NAME }}
          prerelease: ${{ github.ref != 'refs/heads/master' }}
          body: |
            Build of `${{ github.ref_name }}` at ${{ github.sha }}. It passed the Android 11 emulator smoke test.

            Install it with ObtainX (see the FAQ), or by opening the APK and allowing installs from this source. It is signed with a test key: if the Play Store version of Breathly is installed, uninstall it first.
          files: breathly-v${{ env.VERSION_NAME }}.apk
