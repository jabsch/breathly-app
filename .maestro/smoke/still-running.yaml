appId: com.mmazzarolo.breathly
name: Breathing session and sauna timer are still running
---
- assertVisible:
    id: "exercise.running"
- assertNotVisible:
    id: "exercise.paused"
- assertVisible:
    id: "exercise.experience.sauna.pause"
# 40 seconds with the screen off: the five-minute countdown must be below 04:30 by now.
- assertVisible:
    id: "exercise.timer"
    text: "04:[0-2][0-9]|0[0-3]:[0-5][0-9]"
# The two pause on their own: pausing the breathing leaves the sauna running.
- tapOn:
    id: "exercise.pause"
- extendedWaitUntil:
    visible:
      id: "exercise.paused"
    timeout: 5000
- assertVisible:
    id: "exercise.experience.sauna.pause"
- tapOn:
    id: "exercise.experience.sauna.pause"
- assertVisible:
    id: "exercise.experience.sauna.resume"
- tapOn:
    id: "exercise.resume"
- extendedWaitUntil:
    visible:
      id: "exercise.running"
    timeout: 5000
- assertVisible:
    id: "exercise.experience.sauna.resume"
# Swiping left shows the home page and leaves the session running; its card brings it back.
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 5000
- assertVisible:
    id: "home.experience.breathing.pause"
- tapOn:
    id: "home.experience.breathing.open"
- extendedWaitUntil:
    visible:
      id: "exercise.running"
    timeout: 5000
# Swiping left twice from the session reaches the menu; back closes it.
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 5000
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: "menu.settings"
    timeout: 5000
- back
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 5000
- tapOn:
    id: "home.experience.sauna.stop"
- tapOn:
    id: "home.experience.breathing.stop"
- assertVisible:
    id: "home.experience.breathing.start"
