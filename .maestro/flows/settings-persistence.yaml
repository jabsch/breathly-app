appId: com.mmazzarolo.breathly
name: Save an experience and persist settings
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 10000
# A new breathing experience, saved as a card.
- tapOn:
    id: "home.create-experience"
- extendedWaitUntil:
    visible:
      id: "experience.screen"
    timeout: 5000
- assertVisible: ".*Deep Calm \\(4-7-8-0\\).*"
- tapOn:
    id: "experience.pattern"
- assertVisible:
    id: "experience.patterns.screen"
- tapOn:
    id: "experience.pattern.square"
- runFlow:
    file: ../subflows/return-from-patterns.yaml
- assertVisible: ".*Square \\(4-4-4-4\\).*"
- runFlow:
    file: ../subflows/set-disabled-voice.yaml
- tapOn:
    id: "experience.save"
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 5000
- assertVisible: "Square"
# A new timer, named when "No Pattern: Custom Timer" is picked.
- tapOn:
    id: "home.create-experience"
- tapOn:
    id: "experience.pattern"
- tapOn:
    id: "experience.pattern.no-pattern"
- inputText: "Tea"
- tapOn:
    id: "experience.name-ok"
- tapOn:
    id: "experience.save"
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 5000
- assertVisible: "Tea"
# The app starts in the dark theme; switch to light in the menu's settings.
- tapOn:
    id: "home.menu"
- tapOn:
    id: "menu.settings"
- extendedWaitUntil:
    visible:
      id: "settings.screen"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "settings.system-theme"
    direction: DOWN
- runFlow:
    file: ../subflows/set-light-theme.yaml
- runFlow:
    file: ../subflows/close-settings.yaml
- killApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 10000
- assertVisible: "Square"
- assertVisible: "Tea"
- assertVisible: ".*No voice.*"
- tapOn:
    id: "home.menu"
- tapOn:
    id: "menu.settings"
- scrollUntilVisible:
    element:
      id: "settings.theme"
    direction: DOWN
- assertVisible: ".*Light theme.*"
