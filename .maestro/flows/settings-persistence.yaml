appId: com.mmazzarolo.breathly
name: Customize and persist settings
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 10000
- tapOn:
    id: "home.customize"
- extendedWaitUntil:
    visible:
      id: "settings.screen"
    timeout: 5000
- assertVisible: ".*Deep Calm \\(4-7-8-0\\).*"
- tapOn:
    id: "settings.pattern"
- assertVisible:
    id: "settings.patterns.screen"
- tapOn:
    id: "settings.pattern.square"
- runFlow:
    file: ../subflows/return-from-patterns.yaml
- assertVisible: ".*Square \\(4-4-4-4\\).*"
- runFlow:
    file: ../subflows/set-disabled-voice.yaml
# The app starts in the dark theme; switch to light and check that it sticks.
- runFlow:
    file: ../subflows/set-light-theme.yaml
- tapOn:
    id: "settings.vibration"
- scrollUntilVisible:
    element:
      id: "settings.timer.increase"
    direction: DOWN
- tapOn:
    id: "settings.timer.increase"
- runFlow:
    file: ../subflows/close-settings.yaml
- assertVisible:
    id: "home.screen"
- killApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 10000
- tapOn:
    id: "home.customize"
- extendedWaitUntil:
    visible:
      id: "settings.screen"
    timeout: 5000
- assertVisible: ".*Square \\(4-4-4-4\\).*"
- assertVisible: ".*Disabled.*"
- assertVisible: ".*Light theme.*"
- scrollUntilVisible:
    element:
      id: "settings.timer.value"
    direction: DOWN
- assertVisible:
    id: "settings.timer.value"
    text: "6"
