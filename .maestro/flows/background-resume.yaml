appId: com.mmazzarolo.breathly
name: Background a running exercise
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 10000
- tapOn:
    id: "home.start-session"
- extendedWaitUntil:
    visible:
      id: "exercise.running"
    timeout: 8000
- pressKey: home
- launchApp:
    stopApp: false
# Android keeps the session running in a foreground service, so the screen can turn off
# without stopping the cues.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: "exercise.running"
          timeout: 5000
      - assertNotVisible:
          id: "exercise.paused"
# iOS pauses the session in the background.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "exercise.paused"
          timeout: 5000
      - assertVisible: "Paused"
      - tapOn:
          id: "exercise.resume"
      - extendedWaitUntil:
          visible:
            id: "exercise.running"
          timeout: 5000
- tapOn:
    id: "exercise.close"
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 5000
