appId: com.mmazzarolo.breathly
name: Exercise completes after the last exhale
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 10000
# The default limit of five minutes makes this flow unnecessarily slow.
- tapOn:
    id: "home.experience.breathing.decrease"
- tapOn:
    id: "home.experience.breathing.decrease"
- tapOn:
    id: "home.experience.breathing.decrease"
- tapOn:
    id: "home.experience.breathing.decrease"
- assertVisible:
    id: "home.experience.breathing.value"
    text: "1 min"
- tapOn:
    id: "home.experience.breathing.start"
- extendedWaitUntil:
    visible:
      id: "exercise.running"
    timeout: 8000
# The time limit does not stop the exercise immediately: the exercise continues
# to the end of the current exhale. With the default 4-7-8 pattern this adds a
# maximum of nineteen seconds to the minute of the time limit. The timeout is
# much longer, because a slow emulator makes the exercise clock run behind the
# real time.
- extendedWaitUntil:
    visible:
      id: "exercise.complete"
    timeout: 180000
- assertVisible: "Complete"
- tapOn:
    id: "exercise.close"
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 5000
